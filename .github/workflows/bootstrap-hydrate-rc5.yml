name: bootstrap-hydrate-rc5

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/bootstrap-hydrate-rc5.yml'
      - 'bootstrap/rc5-clean/**'
      - 'bootstrap/assets/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hydrate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-placeholder
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Reconstruct and cryptographically verify RC5 archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(find bootstrap/rc5-clean -maxdepth 1 -type f -name 'part-*' | wc -l)" -eq 12
          cat bootstrap/rc5-clean/part-{000..011} | tr -d '\r\n\t ' > /tmp/rc5.b64
          test "$(wc -c < /tmp/rc5.b64)" -eq 141116
          base64 --decode /tmp/rc5.b64 > /tmp/rc5.tar.xz
          echo 'fe86c254c527a7c4de2761b6a01509fb28e0ffff90ec45d26f7c1c9e7908900b  /tmp/rc5.tar.xz' | sha256sum -c -
          xz -t /tmp/rc5.tar.xz
          test "$(wc -c < /tmp/rc5.tar.xz)" -eq 105836
          mkdir -p /tmp/rc5-src
          tar -xJf /tmp/rc5.tar.xz -C /tmp/rc5-src

      - name: Preserve staged institutional assets
        shell: bash
        run: |
          set -euo pipefail
          test -s bootstrap/assets/icon-192.b64
          test -s bootstrap/assets/icon-512.b64
          mkdir -p /tmp/cbta241-assets
          cp bootstrap/assets/icon-192.b64 /tmp/cbta241-assets/
          cp bootstrap/assets/icon-512.b64 /tmp/cbta241-assets/

      - name: Locate and verify RC5 source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE=$(find /tmp/rc5-src -maxdepth 3 -name package.json -type f | head -n 1)
          test -n "$PACKAGE"
          ROOT=$(dirname "$PACKAGE")
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          node -e "const p=require('$ROOT/package.json'); if(p.version!=='1.0.0-rc.5') throw new Error('Unexpected version '+p.version); if(p.dependencies.next!=='16.3.4') throw new Error('Unexpected Next.js '+p.dependencies.next); console.log(p.name,p.version,p.dependencies.next)"
          test -f "$ROOT/docs/RELEASE_MANIFEST.json"
          node -e "const m=require('$ROOT/docs/RELEASE_MANIFEST.json'); if(m.version!=='1.0.0-rc.5') throw new Error('Manifest version mismatch'); if(m.sourceTreeSha256!=='4f6b580dde3fe42e46b550fc46e67e1210b41abceef167cce8dd22f9eb6169d9') throw new Error('Manifest tree hash mismatch'); console.log('manifest',m.fileCount,m.sourceTreeSha256)"

      - name: Hydrate source tree
        shell: bash
        env:
          ROOT: ${{ steps.source.outputs.root }}
        run: |
          set -euo pipefail
          rsync -a --exclude='.git/' "$ROOT/" ./
          rm -rf .bootstrap bootstrap
          rm -f .github/workflows/bootstrap-hydrate-rc5.yml
          test -f package.json
          test -f .github/workflows/ci.yml

      - name: Restore institutional PWA assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/institution
          python - <<'PY'
          from pathlib import Path
          import base64, re, struct

          jobs = {
              '/tmp/cbta241-assets/icon-192.b64': ('public/institution/icon-192.png', (192, 192)),
              '/tmp/cbta241-assets/icon-512.b64': ('public/institution/icon-512.png', (512, 512)),
          }
          for source, (target, dims) in jobs.items():
              raw = Path(source).read_text()
              clean = ''.join(re.findall(r'[A-Za-z0-9+/=]', raw))
              clean = clean.split('=', 1)[0]
              clean += '=' * ((4 - len(clean) % 4) % 4)
              data = base64.b64decode(clean, validate=True)
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{source}: decoded payload is not PNG')
              width, height = struct.unpack('>II', data[16:24])
              if (width, height) != dims:
                  raise SystemExit(f'{source}: expected {dims}, got {(width, height)}')
              Path(target).write_bytes(data)
              print(target, width, height, len(data))
          icon512 = Path('public/institution/icon-512.png').read_bytes()
          Path('public/institution/icon-maskable-512.png').write_bytes(icon512)
          Path('public/institution/cbta241-logo.png').write_bytes(icon512)
          PY
          file public/institution/icon-192.png public/institution/icon-512.png public/institution/icon-maskable-512.png public/institution/cbta241-logo.png

      - name: Apply server-time lint hardening
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lib/server
          cat > lib/server/time.ts <<'EOF'
          import 'server-only';

          export function currentServerEpochMs(): number {
            return Date.now();
          }
          EOF
          python - <<'PY'
          from pathlib import Path

          audit = Path('app/admin/auditoria/page.tsx')
          text = audit.read_text()
          text = text.replace("import { createSupabaseServerClient } from '@/lib/supabase/server';", "import { createSupabaseServerClient } from '@/lib/supabase/server';\nimport { currentServerEpochMs } from '@/lib/server/time';")
          text = text.replace("const since = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();", "const since = new Date(currentServerEpochMs() - 24 * 60 * 60 * 1000).toISOString();")
          audit.write_text(text)

          corrections = Path('app/docente/correcciones/page.tsx')
          text = corrections.read_text()
          text = text.replace("import { createSupabaseServerClient } from '@/lib/supabase/server';", "import { createSupabaseServerClient } from '@/lib/supabase/server';\nimport { currentServerEpochMs } from '@/lib/server/time';")
          text = text.replace("const now = Date.now();", "const now = currentServerEpochMs();")
          corrections.write_text(text)
          PY
          grep -q 'currentServerEpochMs' app/admin/auditoria/page.tsx
          grep -q 'currentServerEpochMs' app/docente/correcciones/page.tsx

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate deterministic npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Security audit
        run: npm run test:security

      - name: SQL contract audit
        run: npm run test:sql

      - name: Project integrity audit
        run: npm run test:project

      - name: Accessibility static audit
        run: npm run test:a11y:static

      - name: Next.js build
        run: npm run build

      - name: Install Chromium for public E2E
        run: npx playwright install --with-deps chromium

      - name: Public E2E on desktop Chromium
        run: npx playwright test e2e/public.spec.ts --project=desktop-chromium

      - name: Regenerate release manifest after verified changes
        run: npm run release:manifest

      - name: Commit hydrated RC5 only after all gates pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'chore: hydrate RC5 source and npm lockfile after passing gates'
          git push origin HEAD:develop

      - name: Record failed bootstrap run
        if: ${{ failure() }}
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          mkdir -p ci-results
          printf 'run_id=%s\nrun_url=https://github.com/%s/actions/runs/%s\nstatus=failure\nhead_sha=%s\n' "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_SHA" > ci-results/bootstrap-latest.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-results/bootstrap-latest.txt
          git commit -m "ci: record failed bootstrap run $GITHUB_RUN_ID"
          git push origin HEAD:develop
