name: quality-gates

on:
  push:
    branches: [main, develop, 'feat/**', 'fix/**', 'security/**']
  pull_request:

permissions:
  contents: read

env:
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-placeholder
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:security
      - run: npm run test:sql
      - run: npm run test:project
      - run: npm run test:a11y:static
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase test db

  e2e-public:
    runs-on: ubuntu-latest
    needs: [app, database]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/public.spec.ts --project=desktop-chromium

  e2e-authenticated:
    runs-on: ubuntu-latest
    needs: [app, database]
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      E2E_STUDENT_EMAIL: ${{ secrets.E2E_STUDENT_EMAIL }}
      E2E_STUDENT_PASSWORD: ${{ secrets.E2E_STUDENT_PASSWORD }}
      E2E_TEACHER_EMAIL: ${{ secrets.E2E_TEACHER_EMAIL }}
      E2E_TEACHER_PASSWORD: ${{ secrets.E2E_TEACHER_PASSWORD }}
      E2E_CONTROL_EMAIL: ${{ secrets.E2E_CONTROL_EMAIL }}
      E2E_CONTROL_PASSWORD: ${{ secrets.E2E_CONTROL_PASSWORD }}
      E2E_SUPERADMIN_EMAIL: ${{ secrets.E2E_SUPERADMIN_EMAIL }}
      E2E_SUPERADMIN_PASSWORD: ${{ secrets.E2E_SUPERADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Detect authenticated E2E configuration
        id: config
        shell: bash
        run: |
          if [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] && [ -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ] && \
             [ -n "$E2E_STUDENT_EMAIL" ] && [ -n "$E2E_STUDENT_PASSWORD" ] && \
             [ -n "$E2E_TEACHER_EMAIL" ] && [ -n "$E2E_TEACHER_PASSWORD" ] && \
             [ -n "$E2E_CONTROL_EMAIL" ] && [ -n "$E2E_CONTROL_PASSWORD" ] && \
             [ -n "$E2E_SUPERADMIN_EMAIL" ] && [ -n "$E2E_SUPERADMIN_PASSWORD" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Authenticated multi-role E2E is not configured; this gate remains pending.'
          fi
      - if: steps.config.outputs.configured == 'true'
        run: npm ci --no-audit --no-fund
      - if: steps.config.outputs.configured == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.config.outputs.configured == 'true'
        run: npx playwright test e2e/authenticated.spec.ts --project=desktop-chromium
