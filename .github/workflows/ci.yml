name: quality-gates

on:
  push:
    branches: [main, develop, 'feat/**', 'fix/**', 'security/**']
  pull_request:

permissions:
  contents: read

env:
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-placeholder
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Audit production dependencies for high or critical advisories
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:security
      - run: npm run test:sql
      - run: npm run test:project
      - run: npm run test:a11y:static
      - run: npm run build

  database-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start isolated Supabase and apply every migration + seed
        run: supabase start
      - name: Run pgTAP schema, RLS, workflow and Superadmin tests
        run: supabase test db
      - name: Export isolated Supabase credentials and generate one-run role passwords
        shell: bash
        run: |
          set -euo pipefail
          supabase status -o env > /tmp/supabase-status.env
          set -a
          # shellcheck disable=SC1091
          source /tmp/supabase-status.env
          set +a

          LOCAL_URL="${API_URL:-${SUPABASE_URL:-http://127.0.0.1:54321}}"
          LOCAL_PUBLIC_KEY="${PUBLISHABLE_KEY:-${ANON_KEY:-}}"
          LOCAL_SERVICE_KEY="${SECRET_KEY:-${SERVICE_ROLE_KEY:-}}"

          test -n "$LOCAL_URL"
          test -n "$LOCAL_PUBLIC_KEY"
          test -n "$LOCAL_SERVICE_KEY"

          echo "::add-mask::$LOCAL_SERVICE_KEY"
          printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$LOCAL_URL" >> "$GITHUB_ENV"
          printf 'NEXT_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$LOCAL_PUBLIC_KEY" >> "$GITHUB_ENV"
          printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$LOCAL_SERVICE_KEY" >> "$GITHUB_ENV"
          printf 'NEXT_PUBLIC_APP_URL=http://127.0.0.1:3000\n' >> "$GITHUB_ENV"
          printf 'ALLOW_DEMO_USERS=true\n' >> "$GITHUB_ENV"

          make_password() {
            node -e "console.log(require('node:crypto').randomBytes(24).toString('base64url') + '!aA7')"
          }
          STUDENT_PASSWORD="$(make_password)"
          TEACHER_PASSWORD="$(make_password)"
          CONTROL_PASSWORD="$(make_password)"
          SUPERADMIN_PASSWORD="$(make_password)"
          DOC_SECRET="$(node -e "console.log(require('node:crypto').randomBytes(32).toString('hex'))")"

          for value in "$STUDENT_PASSWORD" "$TEACHER_PASSWORD" "$CONTROL_PASSWORD" "$SUPERADMIN_PASSWORD" "$DOC_SECRET"; do
            echo "::add-mask::$value"
          done

          {
            printf 'DOCUMENT_VERIFICATION_SECRET=%s\n' "$DOC_SECRET"
            printf 'DEMO_STUDENT_PASSWORD=%s\n' "$STUDENT_PASSWORD"
            printf 'DEMO_TEACHER_PASSWORD=%s\n' "$TEACHER_PASSWORD"
            printf 'DEMO_CONTROL_PASSWORD=%s\n' "$CONTROL_PASSWORD"
            printf 'DEMO_SUPERADMIN_PASSWORD=%s\n' "$SUPERADMIN_PASSWORD"
            printf 'E2E_STUDENT_EMAIL=alumno.demo@cbta241.local\n'
            printf 'E2E_STUDENT_PASSWORD=%s\n' "$STUDENT_PASSWORD"
            printf 'E2E_TEACHER_EMAIL=docente.demo@cbta241.local\n'
            printf 'E2E_TEACHER_PASSWORD=%s\n' "$TEACHER_PASSWORD"
            printf 'E2E_CONTROL_EMAIL=control.demo@cbta241.local\n'
            printf 'E2E_CONTROL_PASSWORD=%s\n' "$CONTROL_PASSWORD"
            printf 'E2E_SUPERADMIN_EMAIL=admin.demo@cbta241.local\n'
            printf 'E2E_SUPERADMIN_PASSWORD=%s\n' "$SUPERADMIN_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Provision four isolated Auth identities through Supabase Admin API
        run: node scripts/provision-demo-users.mjs
      - name: Install Chromium for authenticated browser journeys
        run: npx playwright install --with-deps chromium
      - name: Require authenticated E2E for all four roles on desktop and Android
        run: npx playwright test e2e/authenticated.spec.ts --project=desktop-chromium --project=android
      - name: Stop isolated Supabase
        if: always()
        run: supabase stop --no-backup

  backup-restore:
    runs-on: ubuntu-latest
    needs: [app]
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start seeded source database
        run: supabase start
      - name: Create logical data backup and capture source integrity counts
        shell: bash
        run: |
          set -euo pipefail
          supabase db dump --local --data-only --use-copy -f /tmp/cbta241-data.sql
          test -s /tmp/cbta241-data.sql
          SOURCE_DB="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$SOURCE_DB"
          SOURCE_COUNTS="$(docker exec "$SOURCE_DB" psql -U postgres -d postgres -Atc "select concat_ws('|',(select count(*) from public.students),(select count(*) from public.teachers),(select count(*) from public.subjects),(select count(*) from public.enrollments),(select count(*) from public.grades),(select count(*) from public.grade_publications),(select count(*) from public.audit_logs));")"
          test -n "$SOURCE_COUNTS"
          printf 'SOURCE_COUNTS=%s\n' "$SOURCE_COUNTS" >> "$GITHUB_ENV"
      - name: Stop source database without retaining local state
        run: supabase stop --no-backup
      - name: Rebuild blank destination from versioned migrations
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cbta241-restore
          mkdir -p /tmp/cbta241-restore
          cp -R supabase /tmp/cbta241-restore/
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/cbta241-restore/supabase/config.toml')
          text = p.read_text()
          text = text.replace('project_id = "cbta241-sistema-academico"', 'project_id = "cbta241-restore-rehearsal"')
          text = text.replace('[db.seed]\nenabled = true', '[db.seed]\nenabled = false')
          p.write_text(text)
          PY
          cd /tmp/cbta241-restore
          supabase start
      - name: Restore logical data and verify counts plus RLS
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/cbta241-restore
          RESTORE_DB="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$RESTORE_DB"
          docker exec -i "$RESTORE_DB" psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            truncate_sql text;
          BEGIN
            SELECT 'TRUNCATE TABLE ' || string_agg(format('%I.%I', schemaname, tablename), ', ') || ' RESTART IDENTITY CASCADE'
              INTO truncate_sql
              FROM pg_tables
             WHERE schemaname = 'public';
            IF truncate_sql IS NOT NULL THEN
              EXECUTE truncate_sql;
            END IF;
          END
          $$;
          SQL
          docker exec -i "$RESTORE_DB" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < /tmp/cbta241-data.sql
          RESTORED_COUNTS="$(docker exec "$RESTORE_DB" psql -U postgres -d postgres -Atc "select concat_ws('|',(select count(*) from public.students),(select count(*) from public.teachers),(select count(*) from public.subjects),(select count(*) from public.enrollments),(select count(*) from public.grades),(select count(*) from public.grade_publications),(select count(*) from public.audit_logs));")"
          test "$RESTORED_COUNTS" = "$SOURCE_COUNTS"
          RLS_GAPS="$(docker exec "$RESTORE_DB" psql -U postgres -d postgres -Atc "select count(*) from pg_tables where schemaname='public' and not rowsecurity;")"
          test "$RLS_GAPS" = "0"
          supabase test db
      - name: Stop restored database
        if: always()
        shell: bash
        run: |
          cd /tmp/cbta241-restore 2>/dev/null && supabase stop --no-backup || true

  e2e-public:
    runs-on: ubuntu-latest
    needs: [app]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Public journeys on desktop and Android
        run: npx playwright test e2e/public.spec.ts --project=desktop-chromium --project=android
